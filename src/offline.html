<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aura Messenger - нет соединения</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #f8fbff;
      background:
        radial-gradient(circle at 20% 15%, rgba(99,102,241,.28), transparent 34rem),
        linear-gradient(135deg, #111526, #070912 70%);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    .panel {
      width: min(520px, 100%);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(10,13,24,.72);
      box-shadow: 0 28px 90px rgba(0,0,0,.36);
      text-align: center;
    }
    img { width: 74px; height: 74px; border-radius: 24px; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: rgba(248,251,255,.72); line-height: 1.6; }
    .actions { display: grid; gap: 12px; }
    button {
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      font: 800 15px/1 Inter, Segoe UI, Arial, sans-serif;
    }
    .primary { background: linear-gradient(135deg, #6366f1, #06b6d4); }
    .secondary {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
    }
    small { display: block; margin-top: 18px; color: rgba(248,251,255,.45); }
  </style>
</head>
<body>
  <main class="panel">
    <img src="../build/icon.svg" alt="Aura"/>
    <h1>Не удалось открыть Aura</h1>
    <p>Проверьте интернет или подождите, если Render просыпается после паузы. Приложение повторно откроет тот же мессенджер, как только соединение появится.</p>
    <div class="actions">
      <button class="primary" id="retry" type="button">Повторить подключение</button>
      <button class="secondary" id="browser" type="button">Открыть в браузере</button>
    </div>
    <small id="details"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const server = params.get('server') || 'https://chat-9l7f.onrender.com';
    const appPath = params.get('appPath') || '/';
    const message = params.get('message') || '';
    document.getElementById('details').textContent = message;
    document.getElementById('retry').addEventListener('click', () => window.auraDesktop.reload());
    document.getElementById('browser').addEventListener('click', () => window.auraDesktop.openExternal(server.replace(/\/+$/, '') + appPath));
  </script>
</body>
</html>
