<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aura Messenger</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8fbff;
      background:
        radial-gradient(circle at 25% 25%, rgba(99,102,241,.34), transparent 36rem),
        radial-gradient(circle at 76% 20%, rgba(6,182,212,.2), transparent 28rem),
        linear-gradient(135deg, #111526, #070912 70%);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    .card { display: grid; justify-items: center; gap: 18px; text-align: center; }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 30px;
      box-shadow: 0 22px 80px rgba(99,102,241,.45);
      animation: float 1.8s ease-in-out infinite alternate;
    }
    h1 { margin: 0; font-size: 30px; line-height: 1; letter-spacing: 0; }
    p { margin: 0; color: rgba(248,251,255,.68); font-size: 14px; }
    .bar {
      width: 220px;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
    }
    .bar::before {
      content: "";
      display: block;
      width: 46%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes float { to { transform: translateY(-8px); } }
    @keyframes load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../build/icon.svg" alt="Aura"/>
    <h1>Aura Messenger</h1>
    <p>Подключаем desktop-приложение</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
</body>
</html>
